[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finllm"
version = "0.1.0"
description = "Análise fundamentalista/técnica com LLM local (Ollama): RAG sobre dados da CVM + benchmark de modelos"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "pymupdf>=1.24",
  "beautifulsoup4>=4.12",
  "tenacity>=8.3",
  "pyyaml>=6.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
finllm = "finllm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/finllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E701", "E702", "B008"]
